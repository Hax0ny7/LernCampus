<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EKG-Detektiv – LernCampus Prototyp</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eaf1f8;background:#0b1422}*{box-sizing:border-box}body{margin:0;padding:22px 12px}.wrap{max-width:940px;margin:auto}h1{margin:0 0 4px;font-size:1.7rem}p{line-height:1.55;color:#b9c9dc}.panel{background:#152236;border:1px solid #30435b;border-radius:16px;padding:18px;margin-top:18px}.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#a9c2dd;font-size:.9rem}.strip{background:#fff;border-radius:9px;overflow:hidden;margin:14px 0}.strip svg{width:100%;height:auto;display:block}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.options button,.action{font:inherit;cursor:pointer;border:1px solid #44617d;border-radius:10px;background:#1d3049;color:white;padding:13px;text-align:left}.options button:hover,.action:hover{background:#2b4563}.options button:disabled{cursor:default;opacity:.8}.options button.correct{background:#16543d;border-color:#40be8b}.options button.wrong{background:#632d39;border-color:#ef8d8d}.action{background:#296a9e;text-align:center;margin-top:14px}.answer{padding:14px;border-radius:10px;background:#20344d;margin-top:14px;line-height:1.55}.small{font-size:.85rem;color:#a9bdd1}.score{font-weight:700;color:#b4f4d5}@media(max-width:520px){.options{grid-template-columns:1fr}h1{font-size:1.4rem}.panel{padding:12px}}
</style><style id="lc-v33-theme">

[class*="process-card"],[class*="onboard-card"] {

}

</style></head><body><main class="wrap"><h1>EKG-Detektiv</h1><p>Interaktiver LernCampus-Prototyp · Sechs stehende 6-Sekunden-Rhythmusstreifen, Ableitung II, 25 mm/s, 10 mm/mV.</p><div class="panel"><div class="meta"><span id="progress"></span><span id="score" class="score"></span></div><div class="strip" id="strip"></div><div class="small">Synthetisch erzeugte Lehrkurven – keine Original-Patienten-EKGs; fachliche Freigabe vor klinischer Schulungsnutzung erforderlich.</div><h2 style="font-size:1.12rem">Welcher Rhythmus ist dargestellt?</h2><div id="options" class="options"></div><div id="feedback" aria-live="polite"></div><button id="next" class="action" hidden>Nächster Streifen</button></div></main>
<script>
'use strict';
const cases=[
{id:'sinus',name:'Sinusrhythmus',explanation:'Regelmäßige P-Wellen vor jedem schmalen QRS-Komplex, konstantes PQ-Intervall und regelmäßige RR-Abstände.'},
{id:'af',name:'Vorhofflimmern',explanation:'Absolut unregelmäßige RR-Abstände ohne reproduzierbare geordnete P-Wellen; schmale QRS-Komplexe in diesem Beispiel.'},
{id:'wenck',name:'AV-Block II° Typ Wenckebach',explanation:'Die PQ-Zeit verlängert sich von Schlag zu Schlag, bis eine P-Welle nicht übergeleitet wird; danach beginnt die Sequenz erneut.'},
{id:'mobitz',name:'AV-Block II° Typ Mobitz II',explanation:'Regelmäßige P-Wellen mit konstantem PQ-Intervall bei übergeleiteten Schlägen; einzelne P-Wellen werden ohne vorherige PQ-Verlängerung nicht übergeleitet.'},
{id:'third',name:'AV-Block III°',explanation:'P-Wellen und QRS-Komplexe laufen unabhängig voneinander (AV-Dissoziation); hier langsamer ventrikulärer Ersatzrhythmus.'},
{id:'vt',name:'Ventrikuläre Tachykardie',explanation:'Regelmäßige schnelle Breitkomplextachykardie ohne erkennbare vorangehende P-Wellen. Eine Breitkomplextachykardie ist klinisch zunächst als VT zu behandeln, bis anderes gesichert ist.'}
];
const W=1200,H=260,baseline=133,pxPerSecond=200;let index=0,points=0,answered=false;
function gaussian(t,center,width,amp){let z=(t-center)/width;return amp*Math.exp(-.5*z*z)}
function beatsSignal(t,beats,{wide=false, p=true, tWave=true}={}){let v=0;for(const b of beats){if(p)v+=gaussian(t,b-.19,.035,.12);if(wide){v+=gaussian(t,b-.035,.055,-.35)+gaussian(t,b+.045,.083,1.18)+gaussian(t,b+.155,.065,-.42)}else{v+=gaussian(t,b-.018,.012,-.12)+gaussian(t,b,.014,1.1)+gaussian(t,b+.025,.015,-.25)}if(tWave)v+=gaussian(t,b+(wide?.31:.27),wide?.10:.09,wide?-.24:.28)}return v}
function waveform(kind,t){let v=0;
if(kind==='sinus')v=beatsSignal(t,[.48,1.31,2.14,2.97,3.80,4.63,5.46]);
if(kind==='af'){v=beatsSignal(t,[.33,.88,1.83,2.42,3.59,4.31,4.72,5.62],{p:false});v+=.023*Math.sin(2*Math.PI*7.3*t)+.018*Math.sin(2*Math.PI*10.1*t)}
if(kind==='wenck'){let p=[.22,1.02,1.82,2.62,3.42,4.22,5.02,5.82],pr=[.16,.25,.34,null,.16,.25,.34,null];for(let i=0;i<p.length;i++){v+=gaussian(t,p[i],.03,.15);if(pr[i]!==null)v+=beatsSignal(t,[p[i]+pr[i]],{p:false})}}
if(kind==='mobitz'){let p=[.22,1.02,1.82,2.62,3.42,4.22,5.02,5.82];for(let i=0;i<p.length;i++){v+=gaussian(t,p[i],.03,.15);if(i!==3&&i!==7)v+=beatsSignal(t,[p[i]+.20],{p:false})}}
if(kind==='third'){let p=[];for(let b=.17;b<6;b+=.61)p.push(b);for(const b of p)v+=gaussian(t,b,.03,.16);v+=beatsSignal(t,[.65,2.15,3.65,5.15],{p:false,wide:true})}
if(kind==='vt')v=beatsSignal(t,[.19,.60,1.01,1.42,1.83,2.24,2.65,3.06,3.47,3.88,4.29,4.70,5.11,5.52,5.93],{p:false,wide:true,tWave:false});
return v}
function svgFor(kind,annotate=false){let lines='';for(let x=0;x<=W;x+=10){lines+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="${x%50===0?'#e8a8af':'#f4d8db'}" stroke-width="${x%50===0?1:.55}"/>`}for(let y=0;y<=H;y+=10){lines+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${y%50===0?'#e8a8af':'#f4d8db'}" stroke-width="${y%50===0?1:.55}"/>`}let d='';for(let x=0;x<=W;x+=1){const t=x/pxPerSecond;const y=baseline-65*waveform(kind,t);d+=(x?'L':'M')+x+' '+y.toFixed(2)+' '}let annotations='';if(annotate&&(kind==='wenck'||kind==='mobitz')){const pp=[.22,1.02,1.82,3.42,4.22,5.02];const prs=kind==='wenck'?[.16,.25,.34,.16,.25,.34]:[.20,.20,.20,.20,.20,.20];for(let i=0;i<pp.length;i++){let x1=(pp[i]+.045)*pxPerSecond,x2=(pp[i]+prs[i]-.025)*pxPerSecond;annotations+=`<line x1="${x1}" y1="190" x2="${x2}" y2="190" stroke="#0877c8" stroke-width="4"/><text x="${x1}" y="215" fill="#075c9a" font-size="15">${Math.round(prs[i]*1000)} ms</text>`}}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sechs Sekunden synthetischer EKG-Rhythmusstreifen, Ableitung II"><rect width="${W}" height="${H}" fill="white"/>${lines}<path d="${d}" fill="none" stroke="#202832" stroke-width="2.4" stroke-linejoin="round"/><text x="14" y="23" font-size="18" fill="#27333f">II · 25 mm/s · 10 mm/mV</text>${annotations}<text x="1070" y="238" font-size="16" fill="#445">6 Sekunden</text></svg>`}
function render(){answered=false;document.getElementById('progress').textContent=`Fall ${index+1} von ${cases.length}`;document.getElementById('score').textContent=`${points} Punkte`;document.getElementById('strip').innerHTML=svgFor(cases[index].id);document.getElementById('feedback').innerHTML='';document.getElementById('next').hidden=true;const opts=document.getElementById('options');opts.innerHTML='';const correct=cases[index];const distractors=cases.filter(x=>x.id!==correct.id).sort((a,b)=>((a.name.length+index*3)%7)-((b.name.length+index*3)%7)).slice(0,3);const shown=[correct,...distractors].sort((a,b)=>((a.id.charCodeAt(0)+index*13)%11)-((b.id.charCodeAt(0)+index*13)%11));for(const option of shown){const b=document.createElement('button');b.textContent=option.name;b.onclick=()=>choose(option.id);b.dataset.id=option.id;opts.appendChild(b)}}
function choose(id){if(answered)return;answered=true;const c=cases[index];if(id===c.id)points++;for(const b of document.querySelectorAll('#options button')){b.disabled=true;if(b.dataset.id===c.id)b.classList.add('correct');else if(b.dataset.id===id)b.classList.add('wrong')}document.getElementById('score').textContent=`${points} Punkte`;document.getElementById('strip').innerHTML=svgFor(c.id,true);document.getElementById('feedback').innerHTML=`<div class="answer"><strong>${id===c.id?'Richtig!':'Nicht ganz.'} ${c.name}</strong><p>${c.explanation}</p></div>`;const n=document.getElementById('next');n.hidden=false;n.textContent=index===cases.length-1?'Erneut spielen':'Nächster Streifen'}
document.getElementById('next').onclick=()=>{if(index===cases.length-1){index=0;points=0}else index++;render()};render();
</script></body></html>
